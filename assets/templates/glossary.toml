# 用語・表記統一、呼称表、世界制約。機械（novel_lint.py / build_context.py / ledger_lint.py）が読む。
# 例はすべてコメント。先頭の「# 」を外して書き換える。見本作は『索道日誌』。

# --- 用語と表記 ---------------------------------------------------------
# canonical = 本文で使う表記。variants = 使わない表記（lint が表記ゆれとして拾う。パックには載せない）。
# [[terms]]
# canonical = "索道"
# reading = "さくどう"
# variants = ["ロープウエイ", "ロープウェー"]
# note = "地の文と職員の台詞は「索道」。町の人の台詞は「ケーブル」"
# first_ch = 1

# --- 呼称表（誰が誰をどう呼ぶか。作品単位の正本）---------------------------
# from / to は人物 ID。地の文での呼び方は from = "地の文"。
# [[address]]
# from = "C01"
# to = "C02"
# call = "所長"
# from_ch = 0          # この呼び方を使いはじめる章（省略・0 は最初から）。呼び方が変わったら、行を足して from_ch を書く
# note = "腹を立てているときだけ「三枝さん」"

# --- 世界制約 -----------------------------------------------------------
# forbidden_words = この世界・時代の本文に出さない語（lint が部分一致で拾う）
# absent_concepts = 語でなく概念として存在しないもの（レビュー役が見る）
# unknown_to      = その人物が知らないこと（台詞と内心で前提にしない）
[constraints]
forbidden_words = []          # 例: ["ドローン点検", "自動運転"]
absent_concepts = []          # 例: ["索道の遠隔監視（この町の設備には無い）"]

# [[constraints.unknown_to]]
# character = "C01"
# items = ["祖父が晩年、運休中の山頂駅に通っていたこと"]
